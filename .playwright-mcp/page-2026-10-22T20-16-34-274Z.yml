                    - /placeholder: ""
                    - text: "Dear Lidl Customer Care, I am writing about two recent shops at your Manchester Road store in Burnley (BB11 2EG), made with two separate Lidl Plus accounts (mine and my wife's, Natalia), where coupons that had been activated in the app before paying were not applied at the till. 1. Shop on 4 October 2026, 14:06 (transaction 018094/04, total £87.29), on my account - Coupon: \"£5 off when you spend £60\". It was activated before checkout. - The spend was above £60 and contained no alcohol, gift cards or charity donations. - The coupon appears as \"Not redeemed\" in the app's Purchase summary. 2. Shop on 22 October 2026, 17:18 (transaction 194187/01, total £129.49), on my wife's account - Coupon: \"£8 off when you spend £80\", valid 19 to 25 October. It was activated before checkout. - The spend was above £80 and contained no alcohol. - The coupon appears as \"Not redeemed\" and the Lidl Plus savings show £0.00. - The \"15% off Dairy Manor British Unsalted Butter, 250g\" coupon was also activated. It appears to match the butter on the receipt (2 x £1.85), but no discount was applied. In both cases the Lidl Plus card was scanned and points were credited (+168 and +330). On the 4 October receipt, other Lidl Plus offers did apply (Pepsi Max multibuy, Sol&Mar seeds, Funsize cucumbers). So the card was recognised, but the spend-threshold coupons were not applied. Since this has now happened twice, on two different accounts, there may be a fault with these coupons at the checkout. The conditions of both coupons were met, so I would like the missing discounts of £5.00 and £8.00 (£13.00 in total), plus the butter discount if it applies, credited back to me. Please tell me how you will do this, for example as a refund to my card or as Lidl Plus credit. I have attached one PDF per shop with the receipt, the coupon screenshots and the Purchase summary pages. (Card payment details have been removed from the receipt.) Kind regards, Marin Vacarciuc"
